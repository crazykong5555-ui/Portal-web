<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050816"><title>Iniciar sesión · Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    *{box-sizing:border-box} body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;overflow:hidden;background:radial-gradient(circle at 15% 18%,#173b72,transparent 30rem),radial-gradient(circle at 85% 85%,#541454,transparent 31rem),#050816;color:#e8faff;font-family:Rajdhani,sans-serif} body:before{position:fixed;z-index:-1;inset:0;background-image:linear-gradient(rgba(0,245,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,.04) 1px,transparent 1px);background-size:42px 42px;content:""}.login-shell{width:min(100%,430px)}.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:25px;color:#e8faff;font-family:Orbitron,sans-serif;font-size:1.2rem;font-weight:700;letter-spacing:.13em;text-shadow:0 0 12px #00f5ff}.brand i{display:grid;place-items:center;width:37px;height:37px;border:1px solid #00f5ff;border-radius:9px;background:#00f5ff;color:#05101e;box-shadow:0 0 18px rgba(0,245,255,.7)}.card{padding:34px;border:1px solid rgba(84,230,255,.28);border-radius:14px;background:rgba(9,19,39,.9);box-shadow:0 25px 65px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(12px)}h1{margin:0 0 7px;font-family:Orbitron,sans-serif;font-size:1.35rem}p{margin:0 0 26px;color:#8fa9bd}.field{position:relative;margin:14px 0}.field i{position:absolute;top:15px;left:14px;color:#00f5ff}.field input{width:100%;height:48px;padding:0 14px 0 42px;border:1px solid rgba(143,169,189,.35);border-radius:7px;background:rgba(1,8,21,.7);color:#e8faff;font:600 1rem Rajdhani,sans-serif}.field input:focus{outline:0;border-color:#00f5ff;box-shadow:0 0 0 3px rgba(0,245,255,.12),0 0 13px rgba(0,245,255,.16)}.submit{width:100%;height:48px;margin-top:9px;border:1px solid #00f5ff;border-radius:7px;background:#00f5ff;color:#05101e;font:700 .95rem Rajdhani,sans-serif;letter-spacing:.04em;cursor:pointer}.submit:hover{background:#00aebb;color:#fff;box-shadow:0 0 17px rgba(0,245,255,.38)}.alert{padding:11px;margin:0 0 16px;border:1px solid rgba(255,79,123,.4);border-radius:7px;background:rgba(255,79,123,.12);color:#ffb4c4;font-size:.95rem}.foot{margin-top:20px;color:#8fa9bd;text-align:center;font-size:.85rem;letter-spacing:.04em}@media(max-width:420px){.card{padding:27px 22px}}
  </style>
</head>
<body><main class="login-shell"><div class="brand"><i class="fa-solid fa-crown"></i> PORTAL</div><section class="card"><h1>Bienvenido de nuevo</h1><p>Ingresa tus datos para acceder a tu espacio.</p>{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="alert"><i class="fa-solid fa-circle-exclamation"></i> {{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label class="field"><i class="fa-regular fa-user"></i><input name="user" type="text" placeholder="Usuario" required autofocus></label><label class="field"><i class="fa-solid fa-lock"></i><input name="password" type="password" placeholder="Contraseña" required></label><button class="submit" type="submit">Ingresar <i class="fa-solid fa-arrow-right"></i></button></form></section><div class="foot">Portal · La Fábrica del Software</div></main></body></html>
