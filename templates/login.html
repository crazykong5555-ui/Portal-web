<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión · Portal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#211c50,#6041e8);font-family:'DM Sans',sans-serif;color:#20283e}.login-shell{width:min(100%,430px)}.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:25px;color:#fff;font-family:Outfit,sans-serif;font-size:1.3rem;font-weight:700;letter-spacing:.1em}.brand i{display:grid;place-items:center;width:37px;height:37px;border-radius:11px;background:rgba(255,255,255,.18)}.card{padding:34px;border-radius:18px;background:#fff;box-shadow:0 25px 65px rgba(10,6,45,.32)}h1{margin:0 0 7px;font-family:Outfit,sans-serif;font-size:1.7rem}p{margin:0 0 26px;color:#71798d}.field{position:relative;margin:14px 0}.field i{position:absolute;top:15px;left:14px;color:#9299ac}.field input{width:100%;height:48px;padding:0 14px 0 42px;border:1px solid #dfe2eb;border-radius:9px;font:inherit}.field input:focus{outline:0;border-color:#8673fa;box-shadow:0 0 0 3px #efedff}.submit{width:100%;height:48px;margin-top:9px;border:0;border-radius:9px;background:#5b3df5;color:#fff;font:600 .95rem 'DM Sans';cursor:pointer}.submit:hover{background:#4228cb}.alert{padding:11px;margin:0 0 16px;border-radius:8px;background:#fff0f1;color:#bd3b53;font-size:.88rem}.foot{margin-top:20px;color:#ddd9ff;text-align:center;font-size:.82rem}@media(max-width:420px){.card{padding:27px 22px}}</style></head><body><main class="login-shell"><div class="brand"><i class="fa-solid fa-crown"></i> PORTAL</div><section class="card"><h1>Bienvenido de nuevo</h1><p>Ingresa tus datos para acceder a tu espacio.</p>{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="alert"><i class="fa-solid fa-circle-exclamation"></i> {{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label class="field"><i class="fa-regular fa-user"></i><input name="user" type="text" placeholder="Usuario" required autofocus></label><label class="field"><i class="fa-solid fa-lock"></i><input name="password" type="password" placeholder="Contraseña" required></label><button class="submit" type="submit">Ingresar <i class="fa-solid fa-arrow-right"></i></button></form></section><div class="foot">Portal · La Fábrica del Software</div></main></body></html>
