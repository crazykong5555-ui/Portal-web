{% extends 'layout.html' %}{% block title %}Editar contacto · Portal{% endblock %}{% block body %}<div class="edit-wrap"><div class="page-heading"><a class="back-link" href="{{ url_for('contacts') }}"><i class="fa-solid fa-arrow-left"></i> Volver a contactos</a><h1>Editar contacto</h1><p>Actualiza la información de {{ contact.1 }}.</p></div><section class="card portal-card"><div class="card-body"><form action="{{ url_for('update_contact', id=contact.0) }}" method="post"><div class="form-row"><div class="form-group col-md-6"><label>Nombre completo</label><input name="fullname" class="form-control" value="{{ contact.1 }}" required></div><div class="form-group col-md-6"><label>Teléfono</label><input name="phone" type="tel" class="form-control" value="{{ contact.2 }}" required></div></div><div class="form-row"><div class="form-group col-md-6"><label>Correo electrónico</label><input name="email" type="email" class="form-control" value="{{ contact.3 or '' }}"></div><div class="form-group col-md-6"><label>Sitio web</label><input name="url" type="url" class="form-control" value="{{ contact.4 or '' }}"></div></div><div class="d-flex justify-content-end mt-2"><a href="{{ url_for('contacts') }}" class="btn btn-light mr-2">Cancelar</a><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Guardar cambios</button></div></form></div></section></div>{% endblock %}{% block head %}<style>.edit-wrap{max-width:760px;margin:auto}.back-link{display:inline-block;margin-bottom:16px;color:var(--primary);font-size:.88rem;font-weight:600}.back-link:hover{text-decoration:none}</style>{% endblock %}
